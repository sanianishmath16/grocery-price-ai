server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Body size limit (10 images × 2 MB each + JSON overhead) ──────────
    client_max_body_size 25M;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header Referrer-Policy          "same-origin"     always;
    # CSP: allow same-origin resources only; images may be data: URIs (base64 previews)
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # ── Manifest mime type ────────────────────────────────────────────────
    types {
        application/manifest+json  json;
    }

    # ── Static frontend assets ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively; HTML is always fresh
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Proxy /api/* → FastAPI backend ────────────────────────────────────
    # In docker-compose: `api` resolves to the separate api container.
    # In single-container prod: override with NGINX_API_HOST env var (127.0.0.1).
    # Default remains `api` so docker-compose works with no changes.
    location /api/ {
        proxy_pass             http://api:8000;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image analysis can take a few seconds
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;

        # Allow large JSON bodies (base64 images)
        client_max_body_size   25M;
    }
}
