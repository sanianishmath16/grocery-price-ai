# render.yaml — Render.com deployment for GroceryAI
#
# Render.com offers a free Web Service tier that runs Docker containers.
# This deploys the production single-container image (nginx + uvicorn).
#
# Setup:
#   1. Push this repo to GitHub (public or private)
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo → Render reads this file automatically
#   4. Set environment variable:  OPENAI_API_KEY = sk-...
#   5. (Optional) Add a free Redis from https://upstash.com and set REDIS_URL
#   6. Deploy → your app is live at https://<service-name>.onrender.com
#
# Free tier note: the service sleeps after 15 min of inactivity and takes
# ~30s to wake up. Upgrade to Starter ($7/mo) for always-on.

services:
  - type: web
    name: groceryai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildArgs:
      BUILD_TARGET: prod
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # you set this manually in the Render dashboard
      - key: REDIS_URL
        sync: false          # set to your Upstash Redis URL, or leave blank
      - key: CORS_ORIGINS
        value: "*"           # tighten after you know your final domain
