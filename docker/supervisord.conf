[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ── nginx — serves static frontend and proxies /api → uvicorn ──────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
priority=10

; ── uvicorn — FastAPI backend on internal port 8000 ────────────────────────
[program:uvicorn]
command=uvicorn main:app --host 127.0.0.1 --port 8000 --workers 2
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/uvicorn.err.log
stdout_logfile=/var/log/supervisor/uvicorn.out.log
priority=20
; Pass all env vars through (OPENAI_API_KEY, REDIS_URL, CORS_ORIGINS)
environment=HOME="/root",USER="root"
