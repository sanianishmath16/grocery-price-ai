# ─── GroceryAI — local development stack ─────────────────────────────────────
#
# Usage:
#   cp .env.example .env          # fill in your values
#   docker-compose up --build
#   open http://localhost
#
# The application is then accessible at http://localhost (port 80).
# nginx serves the frontend and proxies /api/* to FastAPI — no port 8000
# or 6379 needs to be open in a browser.

services:

  # ── FastAPI backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TARGET: dev
    container_name: groceryai-api
    # Port 8000 is intentionally NOT published to the host — nginx proxies to
    # it internally.  Expose it only if you need direct API access for testing:
    #   ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Redis cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: groceryai-redis
    # Redis port is NOT published — only the api container can reach it
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Nginx — serves frontend + proxies /api/* ─────────────────────────────
  frontend:
    image: nginx:1.25-alpine
    container_name: groceryai-frontend
    ports:
      - "80:80"        # http://localhost   (local)
                       # http://<server-ip> (VPS after opening port 80 in firewall)
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes: {}
