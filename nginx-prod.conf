# nginx-prod.conf — used inside the single-container production image
# (nginx + uvicorn run together via supervisord; API is on 127.0.0.1:8000)
#
# ${PORT} is substituted at container start by docker/start.sh using envsubst.
# Render injects PORT=10000; nginx must listen on that port.

server {
    listen ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml application/manifest+json;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "same-origin" always;

    # ── API proxy → uvicorn on 127.0.0.1:8000 ─────────────────────────────────
    location /api/ {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
        client_max_body_size   25M;
    }

    # ── index.html: never cache so versioned asset URLs are always picked up ──
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # ── Static assets with long-lived cache (versioned via ?v= query param) ──
    location ~* \.(css|js|svg|png|ico|webmanifest|json|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Everything else → SPA index.html ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
