# nginx-prod.conf — used inside the single-container production image
# (nginx + uvicorn run together, so API is on 127.0.0.1:8000)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;

    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header Referrer-Policy          "same-origin"     always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # ── Manifest mime type ────────────────────────────────────────────────
    types {
        application/manifest+json  json;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Points to uvicorn running inside the same container
    location /api/ {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
        client_max_body_size   25M;
    }
}
